# Production-like stack: restart policies, resource limits, optional FE nginx.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# QR backup: volume `qr_storage` — sao lưu định kỳ thư mục volume Docker.
# DB backup: pg_dump từ service gis-db (xem docs/DEPLOY.md).

services:
  gis-db:
    image: postgis/postgis:15-3.3
    container_name: gis_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_agriculture_db}
      POSTGRES_USER: ${POSTGRES_USER:-gis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./gis-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  gis-backend:
    build: ./gis-service
    container_name: gis_backend_service
    restart: unless-stopped
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_HOST: gis-db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-gis_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123}
      DATABASE_NAME: ${POSTGRES_DB:-gis_agriculture_db}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJwtKey2026}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUC_PROVINCE_CODE: ${PUC_PROVINCE_CODE:-ST}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:8080}
      QR_STORAGE_PATH: /app/storage/qr
    volumes:
      - qr_storage:/app/storage/qr
    depends_on:
      gis-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  gis-frontend:
    build:
      context: ./web-gis-frontend
      args:
        VITE_GIS_API_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
        VITE_GIS_API_KEY: ${API_KEY:-}
        VITE_GIS_WS_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
    container_name: gis_frontend_web
    restart: unless-stopped
    ports:
      - '${FE_HOST_PORT:-8080}:80'
    depends_on:
      - gis-backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgis_data:
  qr_storage:
